<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mighty Chlorians · TB Performance</title>
<style>
  :root{--bg:#0b0e14;--panel:#141924;--line:#2a3348;--ink:#e6e9f0;--sub:#a7b0c0;--gold:#f4c542;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;}
  body{background:radial-gradient(ellipse at 50% -10%,#141a26,#090b10 70%) fixed;min-height:100vh;}
  .wrap{max-width:820px;margin:0 auto;padding:16px;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  header img{width:52px;height:52px;object-fit:contain;}
  header h1{margin:0;font-size:20px;letter-spacing:1px;line-height:1.2;}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--sub);}
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab{background:#1b2130;border:1px solid #364057;color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;}
  .tab.on{background:#3b5bdb;border-color:#4c6bf0;}
  .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px;}
  .row label{font-size:12.5px;color:var(--sub);}
  select{background:#1b2130;border:1px solid #364057;border-radius:7px;color:var(--ink);padding:8px 10px;font-size:14px;max-width:100%;}
  .scroll{overflow-x:auto;}
  table.t{width:100%;border-collapse:collapse;font-size:14px;}
  table.t th{background:#141414;font-weight:700;color:#f2f2f2;padding:5px 8px;text-align:center;border-bottom:1px solid #2a2a2a;position:sticky;top:0;}
  table.t th.nm,table.t td.nm{text-align:left;padding-left:8px;}
  table.t td{padding:3px 8px;text-align:center;background:#141414;border-bottom:1px solid #222;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.t td.nm{background:#111d2c;font-weight:600;}
  td.lowp{background:#ff0000 !important;color:#fff;}
  td.lowt{background:#c55a11 !important;color:#fff;}
  td.perf{background:#548235 !important;color:#fff;}
  td.pos{background:#c6efce !important;color:#006100;} td.neg{background:#ffc7ce !important;color:#9c0006;}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
  .stat{flex:1 1 120px;background:var(--panel);border:1px solid var(--line);padding:8px 6px;text-align:center;}
  .stat b{display:block;font-size:24px;line-height:30px;}
  .stat span{font-size:11px;letter-spacing:1.5px;color:var(--sub);font-weight:700;text-transform:uppercase;}
  .chartbox{overflow-x:auto;margin-bottom:12px;}
  .pchart{position:relative;height:225px;margin:6px 10px 0;border-bottom:1px solid #364057;}
  .pbar{position:absolute;bottom:34px;border-radius:4px 4px 0 0;}
  .pval{position:absolute;bottom:0;text-align:center;font-size:11px;line-height:1.2;color:var(--sub);}
  .ppct{position:absolute;text-align:center;font-size:12px;font-weight:700;color:#fff;}
  .pline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #e0b04a;}
  .plabel{position:absolute;top:0;font-size:11px;font-weight:700;letter-spacing:1px;color:#e0b04a;white-space:nowrap;}
  .ptag{display:inline-block;font-size:9px;letter-spacing:1px;font-weight:700;color:#e0b04a;border:1px solid rgba(224,176,74,.5);border-radius:4px;padding:0 4px;margin-left:6px;}
  .pname{font-size:30px;font-weight:700;letter-spacing:1px;margin:4px 0 10px;}
  .cap{font-size:13px;color:var(--sub);margin-bottom:8px;}
  footer{margin-top:18px;font-size:11.5px;color:#7d889c;text-align:center;}
</style>
</head>

const PH = ['P3','P4','P5','P6'];
const $ = id => document.getElementById(id);
const sum = w => w.reduce((a,b)=>a+b,0);
const rowTot = r => r.w ? sum(r.w) : r.t;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

let selTb = TBS[TBS.length-1].id, cmpSel = 'auto', filter = 'current', player = null;

function cmpTb(t){
  if(cmpSel==='none') return null;
  if(cmpSel!=='auto'){ const c = TBS.find(x=>x.id===cmpSel); if(c && c.id!==t.id) return c; }
  const i = TBS.findIndex(x=>x.id===t.id); return i>0 ? TBS[i-1] : null;
}
function renderTb(){
  const t = TBS.find(x=>x.id===selTb), c = cmpTb(t);
  $('selTb').innerHTML = TBS.slice().reverse().map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('');
  $('selTb').value = t.id;
  $('selCmp').innerHTML = '<option value="auto">Previous TB</option><option value="none">No comparison</option>' + TBS.filter(x=>x.id!==t.id).slice().reverse().map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('');

  const hasPh = t.phases !== false;
  const prev = c ? new Map(c.rows.map(r=>[r.n.toLowerCase(), rowTot(r)])) : null;
  const rows = t.rows.map(r=>{ const tot = rowTot(r), k = r.n.toLowerCase(); return {n:r.n,w:r.w,tot,d:(prev&&prev.has(k))?tot-prev.get(k):null}; });
  const sort = $('selSort').value;
  rows.sort((a,b)=> sort==='high' ? b.tot-a.tot||a.n.localeCompare(b.n) : sort==='name' ? a.n.toLowerCase().localeCompare(b.n.toLowerCase()) : a.tot-b.tot||a.n.localeCompare(b.n));
  const body = rows.map(r=>{
    const ph = hasPh ? r.w.map((v,i)=>`<td class="${t.max[i]>0&&v<t.max[i]*0.5?'lowp':''}">${v}</td>`).join('') : '';
    const tc = r.tot>=t.perfect?'perf':r.tot<t.low?'lowt':'';
    const dc = r.d===null?'':r.d<0?'neg':'pos';
    return `<tr><td class="nm">${esc(r.n)}</td>${ph}<td class="${tc}">${r.tot}</td>${c?`<td class="${dc}">${r.d===null?'':r.d}</td>`:''}</tr>`;
  }).join('');
  $('tbCap').textContent = t.label + ' · ' + fmtDate(t.date) + (c ? ' · compared with ' + c.label : '') + ' · low threshold ' + t.low;
  $('tbTable').innerHTML = `<table class="t"><thead><tr><th class="nm">User</th>${hasPh?PH.map(p=>`<th>${p}</th>`).join(''):''}<th>P3-P6</th>${c?'<th>Diff with last TB</th>':''}</tr></thead><tbody>${body}</tbody></table>`;

function renderPl(){
  const byName = (a,b)=>a.toLowerCase().localeCompare(b.toLowerCase());
  const all = [...new Set(TBS.flatMap(x=>x.rows.map(r=>r.n)))].sort(byName);
  const nowSet = new Set(TBS[TBS.length-1].rows.map(r=>r.n));
  const cur = all.filter(n=>nowSet.has(n)), old = all.filter(n=>!nowSet.has(n));
  $('selFilter').innerHTML = `<option value="current">Current members (${cur.length})</option><option value="former">Former members (${old.length})</option><option value="all">All (${all.length})</option>`;
  $('selFilter').value = filter;
  const names = filter==='former'?old:filter==='all'?all:cur;
  $('selPlayer').innerHTML = names.map(n=>`<option>${esc(n)}</option>`).join('');
  if(!player || !names.includes(player)) player = names[0];
  if(player) $('selPlayer').value = player;
  if(!player){ $('plBody').innerHTML = '<div class="pname">No members here</div>'; return; }
  const key = player.toLowerCase(), hist = [];
  TBS.forEach(t=>{ const r = t.rows.find(x=>x.n.toLowerCase()===key); if(r){ const tot = rowTot(r); hist.push({t,tot,pct:t.perfect?tot/t.perfect:0}); } });
  const tots = hist.map(h=>h.tot), best = Math.max(...tots), avg = Math.round(sum(tots)/tots.length*10)/10, last = hist[hist.length-1];
  const colW = Math.max(46, Math.min(90, Math.floor(700/hist.length))), barW = Math.round(colW*0.6), H = 130;
  const chart = hist.map((h,i)=>{
    const left = i*colW+Math.round((colW-barW)/2), bh = Math.max(3, Math.round(Math.min(1.15,h.pct)*H));
    const col = h.tot>=h.t.perfect?'#548235':h.tot<h.t.low?'#C55A11':'#5b7fb5';
    const lab = h.t.label.replace(/^TB\s*/i,'');
    const left2 = (hist.length-i)*colW < 100;
    return `<div class="pbar" style="left:${left}px;width:${barW}px;height:${bh}px;background:${col}"></div>`+
      `<div class="ppct" style="left:${i*colW}px;width:${colW}px;bottom:${34+bh+4}px">${Math.round(h.pct*100)}%</div>`+
      `<div class="pval" style="left:${i*colW}px;width:${colW}px">${esc(lab)}</div>`+
      (h.t.pathChange?`<div class="pline" style="left:${i*colW}px"></div><div class="plabel" style="${left2?'left:'+(i*colW-105)+'px;width:100px;text-align:right':'left:'+(i*colW+5)+'px'}">PATH CHANGE</div>`:'');
  }).join('');
  const rows = hist.slice().reverse().map(h=>{
    const tc = h.tot>=h.t.perfect?'perf':h.tot<h.t.low?'lowt':'';
    return `<tr><td class="nm">${esc(h.t.label)}${h.t.pathChange?'<span class="ptag">PATH CHANGE</span>':''}</td><td class="${tc}">${h.tot}</td><td>${Math.round(h.pct*100)}%</td></tr>`;
  }).join('');
  const avgPct = Math.round(sum(hist.map(h=>h.pct))/hist.length*100);
  $('plBody').innerHTML = `<div class="pname">${esc(player)}</div>`+
    `<div class="stats">${[[last.tot,'Latest'],[best,'Best'],[avg,'Average'],[avgPct+'%','Avg % of top']].map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>`+
    `<div class="chartbox"><div class="pchart" style="width:${hist.length*colW}px">${chart}</div></div>`+
    `<div class="scroll"><table class="t"><thead><tr><th class="nm">TB</th><th>P3-P6</th><th>% of top score</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function show(v){
  $('viewTb').style.display = v==='tb'?'':'none'; $('viewPl').style.display = v==='pl'?'':'none';
  $('tabTb').classList.toggle('on', v==='tb'); $('tabPl').classList.toggle('on', v==='pl');
  if(v==='tb') renderTb(); else renderPl();
}
$('tabTb').onclick = ()=>show('tb'); $('tabPl').onclick = ()=>show('pl');

$('selSort').onchange = renderTb;
$('selFilter').onchange = ()=>{ filter = $('selFilter').value; player = null; renderPl(); };
$('selPlayer').onchange = ()=>{ player = $('selPlayer').value; renderPl(); };
$('asof').textContent = 'Latest TB: ' + TBS[TBS.length-1].label + ' · ' + TBS.length + ' TBs on record';
renderTb();
